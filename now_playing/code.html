<style>
        body {
            background-color: #08090a;
            color: #e3e2e3;
            font-family: 'Inter', sans-serif;
            -webkit-font-smoothing: antialiased;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .font-mono-precision {
            font-family: 'Berkeley Mono', monospace;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }

<body class="flex flex-col min-h-screen overflow-hidden">
<!-- Top Navigation Anchor (Manual Implementation of JSON Spec) -->
<header class="bg-[#08090a] flex justify-between items-center px-6 py-4 w-full top-0 z-50">
<div class="flex items-center gap-4">
<button class="hover:bg-white/5 transition-colors active:scale-95 text-[#bdc2ff]">
<span class="material-symbols-outlined">arrow_back</span>
</button>
<h1 class="font-['Inter'] font-[590] tracking-tight text-[#e3e2e3] text-lg">Library</h1>
</div>
<button class="hover:bg-white/5 transition-colors active:scale-95 text-[#bdc2ff]">
<span class="material-symbols-outlined">more_vert</span>
</button>
</header>
<!-- Main Content: Now Playing Canvas -->
<main class="flex-grow flex flex-col items-center justify-center px-8 relative">
<!-- Background Ambient Glow -->
<div class="absolute inset-0 pointer-events-none opacity-30 overflow-hidden">
<div class="absolute -top-[10%] -left-[10%] w-[120%] h-[120%] bg-gradient-to-br from-[#5e6ad2]/20 via-transparent to-transparent blur-[120px]"></div>
</div>
<!-- Album Art Container -->
<div class="w-full max-w-[380px] aspect-square relative z-10 group">
<div class="absolute inset-0 bg-white/[0.05] rounded-xl -m-[1px]"></div>
<img alt="Cinematic album art" class="w-full h-full object-cover rounded-xl shadow-2xl border border-white/10" data-alt="abstract cinematic album cover with deep purple and indigo smoke swirling in high contrast dark atmosphere minimalist aesthetic" src="https://lh3.googleusercontent.com/aida-public/AB6AXuAqZg7KvvY5hmrcvmxok24vpthZzvVpiwsQZ0G8zk34XuRMK8UqUMEa_4Ee0CBMua_Ax9SpBr-d_BBDwZDSfdeT67EBZHwNu2nRxyIz-JRu4m91J6XBUIQsWEtlyoj4lHILQJAtclYr13Be0YNQCQ-c28tIRgCXH--58zVjuMhUPE4IXgsYfbNrDfQIM9-rS0wHUu1VBrOq-UEXp4Dwk7xzkQD9buAleF_HQD_sqpVx5BdY7WyivAhDT7-eM63KYOpNiA1fIt4r6io"/>
</div>
<!-- Metadata Section -->
<div class="w-full max-w-[380px] mt-10 space-y-1">
<h2 class="text-[20px] font-[590] text-[#f7f8f8] tracking-tight">Neon Cathedral</h2>
<p class="text-[15px] font-[400] text-[#8a8f98]">Surgical Precision</p>
</div>
<!-- Seek Bar Container -->
<div class="w-full max-w-[380px] mt-8">
<div class="h-1 w-full bg-white/10 rounded-full overflow-hidden">
<div class="h-full w-[45%] bg-[#5e6ad2] rounded-full"></div>
</div>
<div class="flex justify-between mt-2">
<span class="font-mono-precision text-[10px] text-secondary/60">02:14</span>
<span class="font-mono-precision text-[10px] text-secondary/60">04:52</span>
</div>
</div>
<!-- Controls Cluster -->
<div class="w-full max-w-[380px] mt-8 flex items-center justify-between px-4">
<button class="text-on-surface-variant hover:text-on-surface transition-colors">
<span class="material-symbols-outlined" style="font-size: 28px;">shuffle</span>
</button>
<div class="flex items-center gap-8">
<button class="text-on-surface hover:bg-white/5 p-2 rounded-full transition-all active:scale-90">
<span class="material-symbols-outlined" style="font-size: 32px;">skip_previous</span>
</button>
<button class="w-16 h-16 bg-[#5e6ad2] text-[#fdfaff] rounded-full flex items-center justify-center shadow-lg active:scale-95 transition-transform">
<span class="material-symbols-outlined" style="font-size: 36px; font-variation-settings: 'FILL' 1;">play_arrow</span>
</button>
<button class="text-on-surface hover:bg-white/5 p-2 rounded-full transition-all active:scale-90">
<span class="material-symbols-outlined" style="font-size: 32px;">skip_next</span>
</button>
</div>
<button class="text-on-surface-variant hover:text-on-surface transition-colors">
<span class="material-symbols-outlined" style="font-size: 28px;">repeat</span>
</button>
</div>
<!-- Lyrics/Queue Indicator (Asymmetric metadata) -->
<div class="absolute bottom-32 left-8 md:left-12 rotate-[-90deg] origin-left">
<span class="font-mono-precision text-[10px] tracking-widest text-[#5e6ad2] uppercase opacity-50">LRS-MODE-01 // ACTIVE</span>
</div>
</main>
<!-- Mini Player (Floating contextual element) -->
<div class="fixed bottom-24 left-4 right-4 z-40 md:hidden">
<div class="bg-[#191a1b]/60 backdrop-blur-2xl border border-white/[0.05] rounded-full px-4 py-2 flex items-center gap-3 shadow-[0_20px_40px_rgba(0,0,0,0.4)]">
<img alt="Mini album art" class="w-10 h-10 rounded-full object-cover" data-alt="small square album thumbnail showing moody city lights reflected in a rainy window at night" src="https://lh3.googleusercontent.com/aida-public/AB6AXuCXFmi_FIJxU_rckQj9n1OriIpj1llHFZGX48e2zbVIle4dmQRgmkCC1tS6xMPlenU-rLBm8ibfZKLyZPmGFCMc40wvZk5D0HNou71mS4GqJM07fbDEJK7UxVwLK_VFSggY9drs-NIxOxO4XozZSsAQNY1hCjgye4EHcw0vdEufClIuKSVY7FUBsNcVgiadv-PwcaqnOZlklxTmbafjN93wocM6RPagIZmV23Qt1AkmKXOktQihedg93Xc0ICi4iQD2YiH5AVApQMs"/>
<div class="flex-grow min-w-0">
<p class="text-xs font-[510] text-on-surface truncate">Digital Surgeon</p>
<p class="text-[10px] text-on-surface-variant truncate">Ether Cluster</p>
</div>
<div class="flex items-center gap-2">
<button class="text-primary"><span class="material-symbols-outlined">pause</span></button>
<button class="text-on-surface-variant"><span class="material-symbols-outlined">close</span></button>
</div>
</div>
</div>
<!-- Bottom Navigation Bar (Execution of JSON Spec) -->
<nav class="fixed bottom-0 left-0 w-full z-50 flex justify-around items-center pt-3 pb-6 px-4 bg-[#0f1011]/80 backdrop-blur-xl border-t border-white/[0.08] shadow-[0_-10px_30px_rgba(0,0,0,0.5)]">
<a class="flex flex-col items-center justify-center text-[#c5c6d1] opacity-60 hover:opacity-100 transition-opacity active:scale-90 duration-200" href="#">
<span class="material-symbols-outlined">home</span>
<span class="font-['Inter'] font-[510] text-[10px] tracking-wide mt-1">Home</span>
</a>
<a class="flex flex-col items-center justify-center text-[#c5c6d1] opacity-60 hover:opacity-100 transition-opacity active:scale-90 duration-200" href="#">
<span class="material-symbols-outlined">search</span>
<span class="font-['Inter'] font-[510] text-[10px] tracking-wide mt-1">Search</span>
</a>
<!-- Active Tab: Library (Home/Now Playing context) -->
<a class="flex flex-col items-center justify-center text-[#bdc2ff] font-[590] active:scale-90 transition-transform duration-200" href="#">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">library_music</span>
<span class="font-['Inter'] font-[510] text-[10px] tracking-wide mt-1">Library</span>
</a>
<a class="flex flex-col items-center justify-center text-[#c5c6d1] opacity-60 hover:opacity-100 transition-opacity active:scale-90 duration-200" href="#">
<span class="material-symbols-outlined">workspace_premium</span>
<span class="font-['Inter'] font-[510] text-[10px] tracking-wide mt-1">Premium</span>
</a>
</nav>
</body></html>
